name: Build and Test PERSISTENCE

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test-persistence:
    runs-on: ubuntu-latest

    services:
      minio:
        image: quay.io/minio/minio
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: server /data --console-address ":9001"
        
    steps:
      # Faz checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura o .NET SDK (ajuste a versão conforme seu projeto)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restaura dependências
      - name: Restore dependencies
        run: dotnet restore ./states_persistence/States_Persistence.sln

      # Faz o build do projeto (sem restaurar novamente)
      - name: Build solution
        run: dotnet build ./states_persistence/States_Persistence.sln --no-restore --configuration Release

      # Roda os testes automatizados
      - name: Run tests
        run: dotnet test ./states_persistence/States_Persistence.sln --no-build --configuration Release --verbosity normal

      # (Opcional) Gera relatório de cobertura
      # Ative se você quiser visualizar métricas de testes no Actions
      # - name: Run tests with coverage
      #   run: dotnet test --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura

      # (Opcional) Publica resultados no GitHub
      # - name: Upload test results
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: test-results
      #     path: '**/TestResults/*.trx'